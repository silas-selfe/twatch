# multicam configuration -- which cameras fuse, how association behaves,
# and where the world-space count gates sit. This site is GEO-calibrated
# (watch_multi.py calibrate): world units are METERS, gates are lat/lon,
# speeds are true m/s. Like config.yaml, values that change data meaning
# belong here, not in code.

label: "W MLK Blvd -- 2-camera fusion"

# NVR channels; stream URLs derive from TW_CAMERA_SOURCE (node/.env) the
# same way --also-show does. Each needs cameras/cam<N>/calibration.yaml.
# Camera 2 (gangway) removed: fully overlapped by 1+3 and its short noisy
# tracks (street sliver, median 4 frames) caused false transitive merges.
cameras: ["1", "3"]

# legacy ref-px fallback only (geo sites render live tiles instead)
ref: discovered/ref.PNG

model:                    # live fusion (streams share the GPU)
  weights: yolo11s.pt
  imgsz: 640
  conf: 0.15
  device: auto            # mps (Apple) / cuda / cpu
  max_fps: 8              # per-camera inference cap -- the main compute knob;
                          # a crossing takes ~3 s, so 8 fps = 20+ looks

model_offline:            # replay validation (one stream at a time)
  weights: yolo11s.pt
  imgsz: 960
  conf: 0.15
  device: auto

association:              # METERS (geo world)
  bin_s: 0.25             # engine step / matching window (s)
  gate: 4                 # concurrent match gate
  tight: 1.5              # single-bin merge must be this tight
  min_votes: 2            # co-matched bins before a pair merges
  stitch_dt_s: 4          # max handoff gap (blind wedge between cams 1/3)
  stitch_gate: 6          # gate on the velocity-predicted position
  min_speed: 1            # m/s -- never stitch parked/jittering tracks

counting:
  min_travel: 8           # meters of net path before a cluster may count
  gates:                  # geo mode: a/b are [lat, lon]
    - id: mid-block
      a: [39.0767108, -84.5146141]   # near-roadway crossing, cam1/cam3 junction
      b: [39.0767862, -84.5146353]   # 8.5 m across parking + travel lanes
