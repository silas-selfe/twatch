<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>twatch geo calibration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#101312; --panel:#181d1b; --line:#2a322f; --text:#e8ece9;
          --muted:#93a09a; --accent:#ffb020; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); height:100vh;
         font:14px/1.45 "Segoe UI", system-ui, sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:8px 14px;
           border-bottom:1px solid var(--line); flex:0 0 auto; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:600; }
  select, button { background:var(--panel); color:var(--text);
                   border:1px solid var(--line); border-radius:8px;
                   padding:6px 12px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); color:#1a1205; font-weight:600;
                   border-color:var(--accent); }
  button.active { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  label.ctl { display:flex; align-items:center; gap:6px; font-size:12px;
              color:var(--muted); }
  input[type=range] { width:110px; accent-color:var(--accent); }
  #status { color:var(--muted); margin-left:auto; }
  #turn { font-weight:600; color:var(--accent); }
  main { flex:1 1 auto; display:flex; min-height:0; }
  #left, #mappane { flex:1 1 50%; min-width:0; position:relative; }
  #left { border-right:1px solid var(--line); display:flex;
          align-items:center; justify-content:center; background:#000;
          overflow:hidden; }
  #camwrap { position:relative; }
  #camimg { display:block; max-width:100%; max-height:100%; cursor:crosshair; }
  #camwrap .pt, .leaflet-container .ptlbl { pointer-events:none; }
  #camwrap .pt { position:absolute; transform:translate(-50%,-50%);
        width:14px; height:14px; border-radius:50%; border:2px solid #fff;
        display:flex; align-items:center; justify-content:center;
        font-size:9px; font-weight:700; color:#fff; text-shadow:0 0 3px #000; }
  #mapEl { position:absolute; inset:0; background:#000; }
  footer { flex:0 0 auto; padding:10px 16px; border-top:1px solid var(--line);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  footer .hint { color:var(--muted); font-size:13px; }
  #pairs { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:99px; padding:2px 10px;
          font-size:12px; color:var(--muted); }
  .chip.good { border-color:#4cc38a; color:#4cc38a; }
  .chip.bad { border-color:#e5484d; color:#e5484d; }
  .gidlbl { background:none; border:none; box-shadow:none; font-weight:700;
            font-size:13px; text-shadow:0 0 4px #000, 0 0 4px #000; }
</style>
</head>
<body>
<header>
  <h1>geo calibration</h1>
  <select id="camsel"></select>
  <button id="georefbtn" title="Drape your trusted screenshot over the map tiles">overlay screenshot</button>
  <label class="ctl">overlay <input type="range" id="overlayop" min="0" max="100"
    value="85" disabled></label>
  <label class="ctl">rotate <input type="range" id="bearing" min="-180" max="180"
    value="0"><button id="north" title="reset to north-up">N</button></label>
  <span>click: <span id="turn">camera</span></span>
  <button id="undo">undo</button>
  <button id="clear">clear</button>
  <button id="save" class="primary" disabled>save (0 pairs)</button>
  <span id="status">loading…</span>
</header>
<main>
  <div id="left"><div id="camwrap"><img id="camimg" alt="calibration source"></div></div>
  <div id="mappane"><div id="mapEl"></div></div>
</main>
<footer>
  <span class="hint" id="hint">Click a GROUND point in the camera (lane-dash
    end, curb corner, manhole), then the same spot on the satellite — or on
    your draped screenshot. 6–8 pairs, spread across the road, lower ⅔ of the
    camera frame.</span>
  <div id="pairs"></div>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>
<script>
"use strict";
const colors = ["#e5484d","#4cc38a","#529bf5","#ffb020","#b672e8",
                "#3ecfd4","#f076a8","#a3be5c","#e8985a","#7f8ef2"];
let cams = [], cam = null, anchor = null;
let mode = "cal";                       // "cal" | "georef"
let imgPts = [], llPts = [], camMarks = [], mapMarks = [], projMarks = [];
let overlay = null;
const img = document.getElementById("camimg");
const wrap = document.getElementById("camwrap");
const statusEl = document.getElementById("status");
const opSlider = document.getElementById("overlayop");

const map = L.map("mapEl", { rotate: true, touchRotate: true,
                             rotateControl: false });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Imagery © Esri", maxZoom: 21, maxNativeZoom: 19
}).addTo(map);
// borders + place labels so you can actually find your site from orbit
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Boundaries © Esri", maxZoom: 21, maxNativeZoom: 19
}).addTo(map);

document.getElementById("bearing").oninput = e =>
  map.setBearing(Number(e.target.value));
document.getElementById("north").onclick = () => {
  map.setBearing(0); document.getElementById("bearing").value = 0;
};
opSlider.oninput = e => overlay && overlay.setOpacity(e.target.value / 100);

function placeOverlay(g) {
  if (overlay) map.removeLayer(overlay);
  overlay = L.imageOverlay.rotated("/refimg",
    L.latLng(g.corners.tl), L.latLng(g.corners.tr), L.latLng(g.corners.bl),
    { opacity: opSlider.value / 100, interactive: false }).addTo(map);
  opSlider.disabled = false;
}

async function init() {
  const cfg = await (await fetch("/config")).json();
  cams = cfg.cameras; anchor = cfg.anchor;
  const sel = document.getElementById("camsel");
  sel.innerHTML = cams.map(c => {
    const st = cfg.calibrated[c];
    const tag = st ? (st.mode === "geo" ? " ✓ geo" : " (ref-px)") : "";
    return `<option value="${c}">camera ${c}${tag}</option>`;
  }).join("");
  sel.onchange = () => pick(sel.value);
  if (anchor) map.setView(anchor, 19);
  else map.setView([39.5, -98.35], 4);  // find your site, zoom in
  const g = await (await fetch("/georef")).json();
  if (g.exists) { placeOverlay(g); if (!anchor) map.setView(g.corners.tl, 18); }
  pick(cams[0]);
}

function pick(c) {
  cam = c; mode = "cal"; clearAll();
  document.getElementById("georefbtn").classList.remove("active");
  img.src = `/still/${c}?t=${Date.now()}`;
  statusEl.textContent = `camera ${c}: click point 1 in the camera`;
}

document.getElementById("georefbtn").onclick = () => {
  if (mode === "georef") { pick(cam); return; }   // cancel
  mode = "georef"; clearAll();
  document.getElementById("georefbtn").classList.add("active");
  img.src = "/refimg";
  statusEl.textContent = "overlay: click a landmark on the SCREENSHOT, " +
    "then the same spot on the map tiles (3 pairs, spread wide)";
};

function turnLabel() {
  const t = document.getElementById("turn");
  const src = mode === "georef" ? "screenshot" : "camera";
  const n = Math.min(imgPts.length, llPts.length) + 1;
  if (imgPts.length > llPts.length) {
    t.textContent = "map"; statusEl.textContent =
      `now click point ${llPts.length + 1} on the map`;
  } else {
    t.textContent = src; statusEl.textContent =
      `click point ${n} on the ${src}`;
  }
  const btn = document.getElementById("save");
  const pairs = Math.min(imgPts.length, llPts.length);
  const need = mode === "georef" ? 2 : 4;
  btn.textContent = mode === "georef"
    ? `place overlay (${pairs} pairs)` : `save (${pairs} pairs)`;
  btn.disabled = pairs < need;
}

img.onclick = e => {
  if (imgPts.length > llPts.length) return;   // it's the map's turn
  const r = img.getBoundingClientRect();
  const sx = img.naturalWidth / r.width, sy = img.naturalHeight / r.height;
  imgPts.push([(e.clientX - r.left) * sx, (e.clientY - r.top) * sy]);
  const d = document.createElement("div");
  d.className = "pt"; d.textContent = imgPts.length;
  d.style.background = colors[(imgPts.length - 1) % colors.length];
  d.style.left = (e.clientX - r.left) + "px";
  d.style.top = (e.clientY - r.top) + "px";
  wrap.appendChild(d); camMarks.push(d);
  turnLabel();
};

map.on("click", e => {
  if (imgPts.length <= llPts.length) return;  // not the map's turn
  llPts.push([e.latlng.lat, e.latlng.lng]);
  const m = L.circleMarker(e.latlng, {
    radius: 7, color: "#fff", weight: 2, fillOpacity: 1,
    fillColor: colors[(llPts.length - 1) % colors.length]
  }).addTo(map);
  m.bindTooltip(String(llPts.length), { permanent: true, direction: "top",
                                        className: "ptlbl" });
  mapMarks.push(m);
  turnLabel();
});

document.getElementById("undo").onclick = () => {
  if (llPts.length === imgPts.length && llPts.length) {
    llPts.pop(); map.removeLayer(mapMarks.pop());
  } else if (imgPts.length) {
    imgPts.pop(); camMarks.pop().remove();
  }
  turnLabel();
};
function clearAll() {
  imgPts = []; llPts = [];
  camMarks.forEach(d => d.remove()); camMarks = [];
  mapMarks.forEach(m => map.removeLayer(m)); mapMarks = [];
  projMarks.forEach(m => map.removeLayer(m)); projMarks = [];
  turnLabel();
}
document.getElementById("clear").onclick = clearAll;

document.getElementById("save").onclick = async () => {
  const n = Math.min(imgPts.length, llPts.length);
  const body = { points_image: imgPts.slice(0, n),
                 points_latlon: llPts.slice(0, n) };
  if (mode === "georef") {
    const res = await (await fetch("/georef", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) })).json();
    if (!res.ok) { statusEl.textContent = "error: " + res.error; return; }
    placeOverlay(res);
    statusEl.textContent = "overlay placed (fit " +
      res.fit_err_m.join(" / ") + " m). Now calibrate cameras against it.";
    pick(cam);
    return;
  }
  body.cam = cam;
  const res = await (await fetch("/save", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) })).json();
  if (!res.ok) { statusEl.textContent = "error: " + res.error; return; }
  anchor = res.anchor;
  projMarks.forEach(m => map.removeLayer(m)); projMarks = [];
  res.projected_latlon.forEach(ll => {
    projMarks.push(L.circleMarker(ll, {
      radius: 4, color: "#000", weight: 1, fillOpacity: 1, fillColor: "#fff"
    }).addTo(map));
  });
  document.getElementById("pairs").innerHTML = res.per_point_m.map((e, i) =>
    `<span class="chip ${e <= 1.5 ? "good" : "bad"}">${i + 1}: ${e} m</span>`
  ).join("");
  statusEl.textContent = `saved camera ${cam} -- mean ${res.err_mean_m} m, ` +
    `max ${res.err_max_m} m. White dots = the fit; re-click bad pairs if any.`;
};
init();
</script>
</body>
</html>
